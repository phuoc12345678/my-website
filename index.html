<html>

<head>

<body>
    <div class="Main_box">

    <div class="background-changer">
        <h2 class="text-change-color">
            chào mừng đến website của tui
        </h2>
        <div class="dropdown">
            <button onclick="myFunction()" class="dropbtn">Menu</button>
            <div id="myDropdown" class="dropdown-content">
                <div class="Left_box">
                    <button onclick="window.location.href='index.html';"
                    class="testbtn"><i class="fa fa-home"></i> Trang chủ</button>

                    <button onclick="window.location.href='Gioi_thieu.html';"
                    class="testbtn"><i class="fa fa-bars"></i> Giới thiệu</button>

                    <button onclick="window.location.href='lien_he.html';"
                    class="testbtn"><i class="fa fa-phone"></i> Liên hệ</button>
                </div>
        </div>
        <p class="text-change-color">
            đây là một website giới thiệu về tui
        </p>
        <p>
            who you are
        </p>
        <button onclick="toggle()"><h2 style="text-align: center;">Bảng điểm </h2></button>
    
            <table id="button_table">
                <tr>
                    <th>Môn học</th>
                    <th>Điểm</th>
                </tr>

                <tr>
                    <td>Toán</td>
                    <td>6.3</td>
                </tr>

                <tr>
                    <td>Văn</td>
                    <td>6</td>
                </tr>

                <tr>
                    <td>Anh Văn</td>
                    <td>5.6</td>
                </tr>

                <tr>
                    <td>Tin học</td>
                    <td>7.4</td>
                </tr>

                <tr>
                    <td>Civics</td>
                    <td>9</td>
                </tr>

                <tr>
                    <td>History & Geography</td>
                    <td>6.8</td>
                </tr>

                <tr>
                    <td>Physical Education</td>
                    <td>8.8</td>
                </tr>

                <tr>
                    <td>Science</td>
                    <td>5.2</td>
                </tr>

                <tr>
                    <td>Music</td>
                    <td>8.8</td>
                </tr>
            </table>

        <script>
        function toggle() {
            var x = document.getElementById("button_table");
           
            if (x.style.display === "none") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
            }



            function myFunction() {
        document.getElementById("myDropdown").classList.toggle("show");
        }

        // Close the dropdown if the user clicks outside of it
        window.onclick = function(event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            var i;
            for (i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
            }
        }
        }
        </script>
